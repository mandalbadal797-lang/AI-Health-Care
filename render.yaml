# Render Blueprint Infrastructure Configuration for MindCampus
services:
  # -------------------------------------------------------------
  # 1. Backend Web Service (FastAPI)
  # -------------------------------------------------------------
  - type: web
    name: mindcampus-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./mindcampus_prod.db
      - key: CORS_ORIGINS
        value: '["https://mindcampus-frontend.onrender.com", "http://localhost:5173"]'

  # -------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite)
  # -------------------------------------------------------------
  - type: web
    name: mindcampus-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mindcampus-backend.onrender.com/api/v1
